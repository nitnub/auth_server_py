services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      - db
    env_file:
      - ./.env
  db:
    image: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_PASSWORD=password      # TODO: note temp for local dev
      - POSTGRES_DB=myapp               # TODO: note temp for local dev
    volumes:
      - postgres_data:/var/lib/postgresql
  db-test:
    image: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_PASSWORD=password      # TODO: note temp for local dev
      - POSTGRES_DB=myapp_test          # TODO: note temp for local dev
  redis:
    image: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
  redis-test:
    image: redis
volumes:
  postgres_data:
  redis_data:
