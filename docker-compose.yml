services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      - db
    env_file:
      - ./.env
  db:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=password      # TODO: note temp for local
      - POSTGRES_DB=myapp               # TODO: note temp for local
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data: