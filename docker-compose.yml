services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      - db
    env_file:
      - ./.env
  db:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=password      # TODO: note temp for local dev
      - POSTGRES_DB=myapp               # TODO: note temp for local dev
    volumes:
      - postgres_data:/var/lib/postgresql
  redis:
    image: redis
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=password         # TODO: note temp for local dev
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data: